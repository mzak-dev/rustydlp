# No longer pinned to match zed's toolchain -- gpui is gone. Kept as a floor
# because the interface uses let-chains, stable since 1.88 in edition 2024.
[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
# wasm32-unknown-unknown builds `src/web/`, the experimental browser render
# path -- see docs/adr/0005-wasm-render-experiment.md.
targets = ["wasm32-unknown-unknown"]
