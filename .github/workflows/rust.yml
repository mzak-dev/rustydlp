name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only release-please and the jobs that publish a release write anything;
# everything else is read-only.
permissions:
  contents: read

# A PR that gets three pushes in a minute should not tie up three Windows
# runners building the same crate. Pushes to `main` are never cancelled: a
# half-run release-please, or a cancelled upload of a binary to a release that
# already exists, leaves the repo in a state a human has to unpick.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Windows because that is what ships, and because the file picker and the
    # clipboard are the two Windows-only dependencies. The library itself builds
    # and tests anywhere: `cargo test --lib` renders whole screens to a CPU Skia
    # surface with no GPU and no display server.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # --locked throughout: a Cargo.lock that has drifted from Cargo.toml
      # should fail here, loudly, rather than be silently re-resolved on the
      # runner. The release paths all build --locked, so a lockfile CI never
      # checks is one the release finds out about first.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # No --skip yet: render/d3d.rs is not implemented, so there is no test that
      # needs a real D3D12 adapter. When the backend lands, its device test will
      # need skipping here — CI runners have no GPU, and the adapter loop
      # deliberately steps over WARP.
      - run: cargo test --workspace --locked

  # Reads Conventional Commits on `main` since the last release and keeps a
  # standing "chore(main): release X.Y.Z" PR up to date with the version bump
  # (Cargo.toml + Cargo.lock) and changelog that warrants. A plain push just
  # updates that PR (`release_created` stays false, below stays skipped);
  # pushing the merge of that PR itself is what release-please recognizes as
  # the release, and is what makes `release_created` true and cuts the tag +
  # GitHub release on this same run.
  release-please:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode (config-file + manifest-file) rather than the simpler
      # `release-type` input, because this repo has no prior release tag for
      # release-please to anchor to on its own — .release-please-manifest.json
      # is what tells it which version is the baseline to bump from, instead of
      # guessing a starting point.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The default GITHUB_TOKEN cannot trigger workflow runs from its own
          # commits, so the standing release PR opens with no CI on it and sits
          # at "Waiting for approval" until somebody clicks — which is exactly
          # what happened to every release PR this repo has opened so far. Set a
          # RELEASE_PLEASE_TOKEN repository secret (a PAT, or a GitHub App
          # token, with `contents` and `pull-requests` write) and the release PR
          # runs `test` like any other PR. Without the secret this falls back to
          # the old behaviour rather than failing.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    # `needs.release-please.result` is checked explicitly: a job carrying its
    # own `if:` loses the implicit "only when the jobs I need succeeded" guard,
    # so without it this would run even when release-please was skipped.
    if: >-
      needs.release-please.result == 'success'
      && needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p rustydlp
      - uses: actions/upload-artifact@v4
        with:
          name: rustydlp-${{ needs.release-please.outputs.tag_name }}
          path: target/release/rustydlp.exe

  # release-please already created the tag and the GitHub release (empty of
  # binaries) when its PR was merged; this only attaches the Windows build to
  # it as a downloadable asset.
  attach-binary:
    needs: [release-please, build]
    if: >-
      needs.release-please.result == 'success'
      && needs.build.result == 'success'
      && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustydlp-${{ needs.release-please.outputs.tag_name }}
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # --clobber so re-running this job after a failure further down (or
        # after a partial upload) replaces the asset instead of failing on the
        # name already being taken.
        run: gh release upload "$TAG" rustydlp.exe --clobber
