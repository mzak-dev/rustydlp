name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the release job writes anything; everything else is read-only.
permissions:
  contents: read

jobs:
  test:
    # Windows because that is what ships, and because the file picker and the
    # clipboard are the two Windows-only dependencies. The library itself builds
    # and tests anywhere: `cargo test --lib` renders whole screens to a CPU Skia
    # surface with no GPU and no display server.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # No --skip yet: render/d3d.rs is not implemented, so there is no test that
      # needs a real D3D12 adapter. When the backend lands, its device test will
      # need skipping here — CI runners have no GPU, and the adapter loop
      # deliberately steps over WARP.
      - run: cargo test --workspace

  build:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Cargo.toml is the single source of truth for the version, so read it back.
      - id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p rustydlp
      - uses: actions/upload-artifact@v4
        with:
          name: rustydlp-${{ steps.version.outputs.version }}
          path: target/release/rustydlp.exe

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustydlp-${{ needs.build.outputs.version }}
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes rustydlp.exe
