name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only release-please and the jobs that publish a release write anything;
# everything else is read-only.
permissions:
  contents: read

jobs:
  test:
    # Windows because that is what ships, and because the file picker and the
    # clipboard are the two Windows-only dependencies. The library itself builds
    # and tests anywhere: `cargo test --lib` renders whole screens to a CPU Skia
    # surface with no GPU and no display server.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # No --skip yet: render/d3d.rs is not implemented, so there is no test that
      # needs a real D3D12 adapter. When the backend lands, its device test will
      # need skipping here — CI runners have no GPU, and the adapter loop
      # deliberately steps over WARP.
      - run: cargo test --workspace

  # Reads Conventional Commits on `main` since the last release and keeps a
  # standing "chore(main): release X.Y.Z" PR up to date with the version bump
  # (Cargo.toml + Cargo.lock) and changelog that warrants. A plain push just
  # updates that PR (`release_created` stays false, below stays skipped);
  # pushing the merge of that PR itself is what release-please recognizes as
  # the release, and is what makes `release_created` true and cuts the tag +
  # GitHub release on this same run.
  #
  # Uses the default GITHUB_TOKEN, which can't trigger *new* workflow runs
  # from its own commits — so opening/updating the release PR won't itself
  # trigger `test` on that PR. That's only a missing CI checkmark on the PR
  # while it sits open, not a problem for the release: a human merging it is
  # a normal push, which runs this whole workflow including `test`. Swap in a
  # PAT via `with: token:` if the standing PR needs its own CI run.
  release-please:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode (config-file + manifest-file) rather than the simpler
      # `release-type` input, because this repo has no prior release tag for
      # release-please to anchor to on its own — .release-please-manifest.json
      # is what tells it 0.0.5 (Cargo.toml's current version) is the baseline
      # to bump from, instead of guessing a starting point.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rustydlp

      # Stages the exe plus the binaries it needs but can't ship in git:
      # ffmpeg/ffprobe (GPL build, for libx264 in the convert feature) land
      # in publish/bin so runner.rs's existing exe-relative lookup finds them
      # for free; yt-dlp lands in publish/seed, NOT bin, so it only ever seeds
      # the app-data copy once (see seed_ytdlp_if_missing) instead of shadowing
      # a self-updated one on every app update.
      - name: Assemble publish directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/bin, publish/seed | Out-Null
          Copy-Item target/release/rustydlp.exe publish/rustydlp.exe
          Copy-Item THIRD_PARTY_NOTICES.txt publish/

          # BtbN's `latest` tag always points at the newest ffmpeg master
          # build. It isn't byte-reproducible across time, but it's always
          # resolvable — unlike a dated autobuild tag, which BtbN eventually
          # prunes.
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted
          $ffmpegBin = Get-ChildItem -Recurse -Path ffmpeg-extracted -Filter ffmpeg.exe | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item "$ffmpegBin/ffmpeg.exe" publish/bin/
          Copy-Item "$ffmpegBin/ffprobe.exe" publish/bin/
          $ffmpegLicense = Get-ChildItem -Recurse -Path ffmpeg-extracted -Filter "LICENSE*" | Select-Object -First 1
          if ($ffmpegLicense) { Copy-Item $ffmpegLicense.FullName publish/ffmpeg-LICENSE.txt }

          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile publish/seed/yt-dlp.exe

      # windows-latest ships a .NET SDK already; vpk is just a dotnet global
      # tool on top of it. `dotnet tool install -g` doesn't reliably put its
      # install dir on PATH for the rest of the job, so add it explicitly.
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Pack Velopack release
        shell: pwsh
        run: |
          $version = "${{ needs.release-please.outputs.tag_name }}".TrimStart('v')
          vpk pack -u rustyDLP -v $version -p publish -e rustydlp.exe -i assets/app-icon.ico

      - uses: actions/upload-artifact@v4
        with:
          name: rustydlp-${{ needs.release-please.outputs.tag_name }}
          path: Releases/*

  # release-please already created the tag and the GitHub release (empty of
  # binaries) when its PR was merged; this only attaches the Velopack release
  # assets (installer, portable bundle, update feed) to it as downloadable
  # assets — the same files vpk pack produced, just uploaded directly rather
  # than through `vpk upload github`, which would need its own dotnet install
  # on this job's runner for no benefit.
  attach-binary:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustydlp-${{ needs.release-please.outputs.tag_name }}
          path: Releases
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" Releases/*
