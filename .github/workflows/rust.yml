name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the release job writes anything; everything else is read-only.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest # the crate is cfg(windows) top to bottom; nothing else can build it
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Skipping the one test whose own doc comment rules out CI: it needs a real D3D12
      # adapter, and the adapter loop deliberately steps over WARP (render/d3d.rs).
      - run: cargo test --workspace -- --skip builds_a_skia_context_on_a_real_d3d12_device

  build:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # Cargo.toml is the single source of truth for the version, so read it back.
      - id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p rustydlp
      - uses: actions/upload-artifact@v4
        with:
          name: rustydlp-${{ steps.version.outputs.version }}
          path: target/release/rustydlp.exe

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustydlp-${{ needs.build.outputs.version }}
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes rustydlp.exe
